services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: affiliategads_pseo_web
    restart: always
    ports:
      # 只绑定回环地址：对外流量一律走 Cloudflare → 反代/隧道回源，
      # 避免 3000 端口直接暴露公网（绕过 Cloudflare 防护、暴露源站 IP）。
      # 服务器本机反代（nginx/caddy/Cloudflare Tunnel）仍可正常访问 127.0.0.1:3000。
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_AMAZON_AFFILIATE_TAG=${NEXT_PUBLIC_AMAZON_AFFILIATE_TAG:-jyu0a-20}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://aads.togomol.com}
      - NEXT_PUBLIC_GA_CONVERSION_ID=${NEXT_PUBLIC_GA_CONVERSION_ID:-AW-17885747857}
      - NEXT_PUBLIC_GA_CONVERSION_LABEL=${NEXT_PUBLIC_GA_CONVERSION_LABEL:-}
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CUSTOM_AI_BASE_URL=${CUSTOM_AI_BASE_URL:-}
      - CUSTOM_AI_API_KEY=${CUSTOM_AI_API_KEY:-}
      - CUSTOM_AI_MODEL=${CUSTOM_AI_MODEL:-}
      - CUSTOM_AI_PROTOCOL=${CUSTOM_AI_PROTOCOL:-openai}
      - AI_MODEL_CHOICE=${AI_MODEL_CHOICE:-auto}
      - BING_API_KEY=${BING_API_KEY:-}
      - SOCIAL_WEBHOOK_URL=${SOCIAL_WEBHOOK_URL:-}
      - AYRSHARE_API_KEY=${AYRSHARE_API_KEY:-}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - PA_ACCESS_KEY=${PA_ACCESS_KEY:-}
      - PA_SECRET_KEY=${PA_SECRET_KEY:-}
      - PA_PARTNER_TAG=${PA_PARTNER_TAG:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - LEADS_FROM_EMAIL=${LEADS_FROM_EMAIL:-}
      # 不设弱密码兜底：留空时 adminAuth fail-closed，登录一律拒绝
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
      - ./content:/app/content
      - ./reports:/app/reports
    # 应用层探活：检测进程僵死 / 静默崩溃（restart: always 只能处理进程退出）
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 5 http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 资源上限：防止 AI 批量生成任务内存失控拖垮宿主机
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
    # 日志轮转：防止容器日志无限增长撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 优雅停机：等待 in-flight 请求完成（Next.js standalone 响应 SIGTERM）
    stop_grace_period: 20s
